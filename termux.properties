# ~/.termux/termux.properties
# NoxMod — fila de teclas extra pensada para código y terminal

# Fila de símbolos útiles al escribir comandos / código
extra-keys = [ \
  ['KEYBOARD','ESC','/','-','HOME','UP','END'], \
  ['TAB','CTRL','ALT','LEFT','DOWN','RIGHT','PGDN'], \
  ['>','<','|','&&',';','~','`'] \
]

# Cursor más visible y respuesta táctil
terminal-cursor-style = bar
terminal-cursor-blink-rate = 500
bell-character = ignore

# Permite usar Ctrl+Alt+F para pantalla completa, etc. (comodidad general)
use-fullscreen = false
use-black-ui = true
